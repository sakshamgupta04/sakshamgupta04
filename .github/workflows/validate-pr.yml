name: Validate Profile README PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/**'
      - 'templates/**'
      - 'scripts/**'
      - 'tests/**'
      - 'assets/**'
      - 'docs/**'
      - 'PROJECT_RULES.md'
      - 'requirements.txt'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify lint, tests, README generation, and links
        run: python scripts/verify.py
