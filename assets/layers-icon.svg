<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 150" width="160" height="150" fill="none">
  <defs>
    <linearGradient id="layerTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="layerMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D28D9" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="layerBot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0C4A6E" stop-opacity="0.9" />
    </linearGradient>
    <filter id="layerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <ellipse cx="80" cy="75" rx="50" ry="35" fill="#38BDF8" opacity="0.25" filter="url(#layerGlow)" />

  <!-- Bottom Layer -->
  <g transform="translate(0, 48)">
    <path d="M 80 18 L 138 48 L 80 78 L 22 48 Z" fill="url(#layerBot)" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.5" />
    <path d="M 22 48 L 80 78 L 80 88 L 22 58 Z" fill="#0C4A6E" opacity="0.6" />
    <path d="M 138 48 L 80 78 L 80 88 L 138 58 Z" fill="#1E1B4B" opacity="0.6" />
  </g>

  <!-- Middle Layer -->
  <g transform="translate(0, 24)">
    <path d="M 80 18 L 138 48 L 80 78 L 22 48 Z" fill="url(#layerMid)" stroke="#8B5CF6" stroke-width="1.2" stroke-opacity="0.7" />
    <path d="M 22 48 L 80 78 L 80 88 L 22 58 Z" fill="#4C1D95" opacity="0.7" />
    <path d="M 138 48 L 80 78 L 80 88 L 138 58 Z" fill="#6D28D9" opacity="0.7" />
  </g>

  <!-- Top Layer -->
  <g transform="translate(0, 0)">
    <path d="M 80 18 L 138 48 L 80 78 L 22 48 Z" fill="url(#layerTop)" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.6" />
    <path d="M 22 48 L 80 78 L 80 88 L 22 58 Z" fill="#6D28D9" />
    <path d="M 138 48 L 80 78 L 80 88 L 138 58 Z" fill="#8B5CF6" />
    <text x="80" y="55" font-family="ui-monospace, monospace" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">&lt; / &gt;</text>
  </g>
</svg>

