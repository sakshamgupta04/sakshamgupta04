<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220">
  <defs>
    <style>
      .window-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
      .titlebar-bg { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .title-text { fill: #8b949e; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; font-weight: 500; text-anchor: middle; }
      .terminal-text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
      .prompt-user { fill: #58a6ff; font-weight: 600; }
      .prompt-sym { fill: #55d6a0; font-weight: 600; }
      .cmd { fill: #f0f6fc; font-weight: 600; }
      .name-text { fill: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; }
      .role-tag { fill: #55d6a0; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; font-weight: 600; }
      .mission-text { fill: #a7d3ed; font-size: 12px; }
      .tagline-text { fill: #8b949e; font-size: 11.5px; font-style: italic; }
      .cursor { fill: #55d6a0; animation: blink 0.9s step-end infinite; }

      .line { opacity: 0; clip-path: inset(0 100% 0 0); animation-duration: 14s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
      .line-1 { animation-name: anim-line-1; }
      .line-2 { animation-name: anim-line-2; }
      .line-3 { animation-name: anim-line-3; }
      .line-4 { animation-name: anim-line-4; }
      .line-5 { animation-name: anim-line-5; }
      .line-6 { animation-name: anim-line-6; }

      @keyframes anim-line-1 { 0% { opacity: 0; clip-path: inset(0 100% 0 0); } 1% { opacity: 1; clip-path: inset(0 100% 0 0); } 6%, 94% { opacity: 1; clip-path: inset(0 0 0 0); } 97%, 100% { opacity: 0; clip-path: inset(0 100% 0 0); } }
      @keyframes anim-line-2 { 0%, 7% { opacity: 0; clip-path: inset(0 100% 0 0); } 8% { opacity: 1; clip-path: inset(0 100% 0 0); } 15%, 94% { opacity: 1; clip-path: inset(0 0 0 0); } 97%, 100% { opacity: 0; clip-path: inset(0 100% 0 0); } }
      @keyframes anim-line-3 { 0%, 16% { opacity: 0; clip-path: inset(0 100% 0 0); } 17% { opacity: 1; clip-path: inset(0 100% 0 0); } 23%, 94% { opacity: 1; clip-path: inset(0 0 0 0); } 97%, 100% { opacity: 0; clip-path: inset(0 100% 0 0); } }
      @keyframes anim-line-4 { 0%, 24% { opacity: 0; clip-path: inset(0 100% 0 0); } 25% { opacity: 1; clip-path: inset(0 100% 0 0); } 33%, 94% { opacity: 1; clip-path: inset(0 0 0 0); } 97%, 100% { opacity: 0; clip-path: inset(0 100% 0 0); } }
      @keyframes anim-line-5 { 0%, 34% { opacity: 0; clip-path: inset(0 100% 0 0); } 35% { opacity: 1; clip-path: inset(0 100% 0 0); } 42%, 94% { opacity: 1; clip-path: inset(0 0 0 0); } 97%, 100% { opacity: 0; clip-path: inset(0 100% 0 0); } }
      @keyframes anim-line-6 { 0%, 43% { opacity: 0; clip-path: inset(0 100% 0 0); } 44%, 94% { opacity: 1; clip-path: inset(0 0 0 0); } 97%, 100% { opacity: 0; clip-path: inset(0 100% 0 0); } }

      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

      @media (prefers-reduced-motion: reduce) {
        .line { animation: none !important; opacity: 1 !important; clip-path: none !important; }
        .cursor { animation: none !important; opacity: 1 !important; }
      }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="rgba(0, 0, 0, 0.5)" />
    </filter>
  </defs>

  <rect x="2" y="2" width="796" height="216" rx="10" class="window-bg" filter="url(#shadow)" />
  <path d="M 2 12 A 10 10 0 0 1 12 2 L 788 2 A 10 10 0 0 1 798 12 L 798 34 L 2 34 Z" class="titlebar-bg" />

  <circle cx="20" cy="18" r="5.5" fill="#ff5f56" />
  <circle cx="38" cy="18" r="5.5" fill="#ffbd2e" />
  <circle cx="56" cy="18" r="5.5" fill="#27c93f" />

  <text x="400" y="22" class="title-text">sakshamgupta04@terminal:~ (zsh)</text>

  <!-- Illustration on top right -->
  <g transform="translate(686, 48)" opacity="0.9">
    <rect x="0" y="0" width="88" height="58" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1.2" />
    <circle cx="10" cy="9" r="2.2" fill="#ff5f56" />
    <circle cx="17" cy="9" r="2.2" fill="#ffbd2e" />
    <circle cx="24" cy="9" r="2.2" fill="#27c93f" />
    <line x1="0" y1="17" x2="88" y2="17" stroke="#30363d" stroke-width="1" />
    <line x1="10" y1="26" x2="42" y2="26" stroke="#55d6a0" stroke-width="2" stroke-linecap="round" />
    <line x1="47" y1="26" x2="76" y2="26" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" />
    <line x1="10" y1="36" x2="60" y2="36" stroke="#a7d3ed" stroke-width="2" stroke-linecap="round" />
    <line x1="10" y1="46" x2="32" y2="46" stroke="#8b949e" stroke-width="2" stroke-linecap="round" />
    <line x1="38" y1="46" x2="68" y2="46" stroke="#55d6a0" stroke-width="2" stroke-linecap="round" />
  </g>

  <g class="terminal-text">
    <g class="line line-1">
      <text x="24" y="58"><tspan class="prompt-user">sakshamgupta04@github</tspan><tspan fill="#8b949e">:</tspan><tspan class="prompt-sym">~$</tspan><tspan fill="#f0f6fc"> whoami</tspan></text>
    </g>
    <g class="line line-2">
      <text x="24" y="86"><tspan class="name-text">Saksham Gupta</tspan><tspan dx="16" class="role-tag">[ Software Developer · AI/ML Engineer ]</tspan></text>
    </g>
    <g class="line line-3">
      <text x="24" y="116"><tspan class="prompt-user">sakshamgupta04@github</tspan><tspan fill="#8b949e">:</tspan><tspan class="prompt-sym">~$</tspan><tspan fill="#f0f6fc"> cat mission.txt</tspan></text>
    </g>
    <g class="line line-4">
      <text x="24" y="142" class="mission-text">Building intelligent applications, scalable backend systems, and practical AI-powered solutions.</text>
    </g>
    <g class="line line-5">
      <text x="24" y="168" class="tagline-text">&#x21B3; Building software that connects intelligence with real-world use.</text>
    </g>
    <g class="line line-6">
      <text x="24" y="196"><tspan class="prompt-user">sakshamgupta04@github</tspan><tspan fill="#8b949e">:</tspan><tspan class="prompt-sym">~$</tspan><tspan fill="#f0f6fc"> </tspan><tspan class="cursor">&#x2588;</tspan></text>
    </g>
  </g>
</svg>