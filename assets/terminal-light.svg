<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220">
  <defs>
    <style>
      .window-bg { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
      .titlebar-bg { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1; }
      .title-text { fill: #57606a; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; font-weight: 500; text-anchor: middle; }
      .terminal-text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13.5px; fill: #24292f; }
      .prompt-user { fill: #0969da; font-weight: 600; }
      .prompt-sym { fill: #1a7f37; font-weight: 600; }
      .cmd { fill: #24292f; font-weight: 600; }
      .label { fill: #0550ae; font-weight: 600; }
      .val { fill: #24292f; }
      .cursor { fill: #0969da; animation: blink 0.9s step-end infinite; }

      .line { opacity: 0; clip-path: inset(0 100% 0 0); animation-duration: 12s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
      .line-1 { animation-name: anim-line-1; }
      .line-2 { animation-name: anim-line-2; }
      .line-3 { animation-name: anim-line-3; }
      .line-4 { animation-name: anim-line-4; }
      .line-5 { animation-name: anim-line-5; }

      @keyframes anim-line-1 {
        0% { opacity: 0; clip-path: inset(0 100% 0 0); }
        1% { opacity: 1; clip-path: inset(0 100% 0 0); }
        7%, 93% { opacity: 1; clip-path: inset(0 0 0 0); }
        96%, 100% { opacity: 0; clip-path: inset(0 100% 0 0); }
      }
      @keyframes anim-line-2 {
        0%, 8% { opacity: 0; clip-path: inset(0 100% 0 0); }
        9% { opacity: 1; clip-path: inset(0 100% 0 0); }
        15%, 93% { opacity: 1; clip-path: inset(0 0 0 0); }
        96%, 100% { opacity: 0; clip-path: inset(0 100% 0 0); }
      }
      @keyframes anim-line-3 {
        0%, 16% { opacity: 0; clip-path: inset(0 100% 0 0); }
        17% { opacity: 1; clip-path: inset(0 100% 0 0); }
        24%, 93% { opacity: 1; clip-path: inset(0 0 0 0); }
        96%, 100% { opacity: 0; clip-path: inset(0 100% 0 0); }
      }
      @keyframes anim-line-4 {
        0%, 25% { opacity: 0; clip-path: inset(0 100% 0 0); }
        26% { opacity: 1; clip-path: inset(0 100% 0 0); }
        35%, 93% { opacity: 1; clip-path: inset(0 0 0 0); }
        96%, 100% { opacity: 0; clip-path: inset(0 100% 0 0); }
      }
      @keyframes anim-line-5 {
        0%, 36% { opacity: 0; clip-path: inset(0 100% 0 0); }
        37%, 93% { opacity: 1; clip-path: inset(0 0 0 0); }
        96%, 100% { opacity: 0; clip-path: inset(0 100% 0 0); }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .line { animation: none !important; opacity: 1 !important; clip-path: none !important; }
        .cursor { animation: none !important; opacity: 1 !important; }
      }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="rgba(0, 0, 0, 0.08)" />
    </filter>
  </defs>

  <!-- Window frame with shadow -->
  <rect x="2" y="2" width="796" height="216" rx="8" class="window-bg" filter="url(#shadow)" />
  <path d="M 2 10 A 8 8 0 0 1 10 2 L 790 2 A 8 8 0 0 1 798 10 L 798 34 L 2 34 Z" class="titlebar-bg" />

  <!-- Window controls -->
  <circle cx="20" cy="18" r="5.5" fill="#ff5f56" />
  <circle cx="38" cy="18" r="5.5" fill="#ffbd2e" />
  <circle cx="56" cy="18" r="5.5" fill="#27c93f" />

  <!-- Title -->
  <text x="400" y="22" class="title-text">sakshamgupta04@github:~ (zsh)</text>

  <!-- Terminal content -->
  <g class="terminal-text">
    <g class="line line-1">
      <text x="24" y="66"><tspan class="prompt-user">sakshamgupta04@github</tspan><tspan class="val">:</tspan><tspan class="prompt-sym">~$</tspan><tspan class="val"> </tspan><tspan class="cmd">whoami</tspan></text>
    </g>
    <g class="line line-2">
      <text x="24" y="94"><tspan class="label">name:     </tspan><tspan class="val">Saksham Gupta</tspan></text>
    </g>
    <g class="line line-3">
      <text x="24" y="122"><tspan class="label">role:     </tspan><tspan class="val">Full-stack developer and ML engineer</tspan></text>
    </g>
    <g class="line line-4">
      <text x="24" y="150"><tspan class="label">status:   </tspan><tspan class="val">Open to full-time roles: web development, AI/ML engineering, software engineering</tspan></text>
    </g>
    <g class="line line-5">
      <text x="24" y="178"><tspan class="prompt-user">sakshamgupta04@github</tspan><tspan class="val">:</tspan><tspan class="prompt-sym">~$</tspan><tspan class="val"> </tspan><tspan class="cursor">&#x2588;</tspan></text>
    </g>
  </g>
</svg>